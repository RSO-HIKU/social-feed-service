apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "social-feed-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "social-feed-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "social-feed-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "social-feed-service.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: social-feed-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.clusterIP.port }}
          env:
            - name: RABBITMQ_HOST
              value: {{ .Values.rabbitmq.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ .Values.rabbitmq.port | quote }}
            - name: RABBITMQ_USER
              value: {{ .Values.rabbitmq.user | quote }}
            - name: RABBITMQ_PASSWORD
              value: {{ .Values.rabbitmq.password | quote }}