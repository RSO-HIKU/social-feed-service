apiVersion: v1
kind: Service
metadata:
  name: {{ include "social-feed-service.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "social-feed-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "social-feed-service.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.clusterIP.port }}
      targetPort: {{ .Values.service.clusterIP.port }}
