apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "social-feed-service.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: flyway
          image: "{{ .Values.flyway.image.repository }}:{{ .Values.flyway.image.tag | default .Chart.AppVersion }}"
          env:
            - name: FLYWAY_URL
              valueFrom:
                secretKeyRef:
                  name: social-feed-service-db
                  key: FLYWAY_URL
            - name: FLYWAY_USER
              valueFrom:
                secretKeyRef:
                  name: social-feed-service-db
                  key: DB_USER
            - name: FLYWAY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: social-feed-service-db
                  key: DB_PASS
            - name: FLYWAY_SCHEMAS
              value: social_feed_service
            - name: FLYWAY_DEFAULT_SCHEMA
              value: social_feed_service
            - name: FLYWAY_CREATE_SCHEMAS
              value: "true"
          args: ["migrate"] 